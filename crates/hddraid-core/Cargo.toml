[package]
name = "hddraid-core"
description = "Motore di HddRaid: dischi, indice, sincronizzazione, controllo completo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
