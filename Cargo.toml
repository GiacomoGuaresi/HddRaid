[workspace]
resolver = "3"
members = ["crates/hddraid-core", "crates/hddraid-devtools", "crates/hddraid-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Giacomo Guaresi"]
repository = "https://github.com/GiacomoGuaresi/HddRaid"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
