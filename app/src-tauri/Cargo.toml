[package]
name = "hddraid-app"
description = "HddRaid: due dischi esterni sempre uguali"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Il suffisso `_lib` evita un conflitto di nomi con il binario su Windows,
# vedi https://github.com/rust-lang/cargo/issues/8519
name = "hddraid_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hddraid-core = { path = "../../crates/hddraid-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-log = "2.10.1"
log = "0.4.34"
chrono = "0.4.45"
sys-locale = "0.3.2"
